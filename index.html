<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111923"><title>Pocket Sculpt · Creature Builder</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111923;color:#eaf4fa;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}button{background:#263a4b;color:#eaf4fa;border:1px solid #526b7c;border-radius:12px;padding:10px;min-height:42px;font:inherit}button:disabled{opacity:.35}button.active{background:#89c9e9;color:#0d2534;border-color:#b7e9ff}header,footer,aside,.help,.toast{position:fixed;z-index:2}header{top:0;left:0;right:0;padding:12px 12px 8px;display:flex;justify-content:space-between;align-items:start;gap:8px;background:linear-gradient(#111923f5,#111923aa)}header strong{letter-spacing:.07em;font-size:14px}small{color:#9fb7c8;font-size:11px}header .actions{display:flex;gap:5px}header button{padding:8px;min-height:38px}aside{right:10px;top:83px;width:150px;background:#1d2b3be9;border:1px solid #405569;border-radius:16px;padding:12px;display:grid;gap:9px;box-shadow:0 6px 25px #0004}aside label{font-size:12px;color:#d1dce5}input[type=range]{width:100%;accent-color:#89c9e9}footer{bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:12px 8px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#11192300,#111923f9 28%)}footer button{font-size:13px;padding:9px}.help{top:89px;left:12px;max-width:calc(100vw - 185px);font-size:12px;line-height:1.5;color:#afc4d4;pointer-events:none}.toast{left:12px;bottom:94px;font-size:11px;color:#9eb9ca;pointer-events:none}.row{display:flex;gap:6px}.row button{flex:1;min-width:0}.switch{display:flex;gap:6px;align-items:center}input[type=checkbox]{accent-color:#89c9e9}@media(max-width:390px){aside{width:130px;right:7px}.help{max-width:calc(100vw - 150px)}header button{font-size:12px}footer{gap:4px}footer button{font-size:12px;padding:8px}}
</style></head><body><canvas id="view" aria-label="3D creature editor"></canvas>
<header><div><strong>POCKET SCULPT</strong><br><small>CREATURE BUILDER · 0.3</small></div><div class="actions"><button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button><button id="save">Save</button><button id="obj">OBJ</button></div></header>
<div class="help" id="help">Tap a joint to select it.<br>Move: drag joint.<br>Add: tap parent, then empty space.<br>Two fingers: zoom and pan.</div>
<aside><label>Joint radius <output id="radiusText"></output></label><input id="radius" type="range" min=".05" max=".7" step=".01" value=".25"><label class="switch"><input id="mirror" type="checkbox" checked>Mirror limbs</label><button id="body">Body preview: on</button><button id="front">Front view</button><button id="open">Open project</button><button id="reset">Reset creature</button><input id="file" type="file" accept=".json,application/json" hidden></aside>
<footer><button class="active" data-mode="move">Move</button><button data-mode="add">Add limb</button><button data-mode="delete">Delete</button><button data-mode="orbit">Orbit</button></footer><div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),c=$('#view'),g=c.getContext('2d');let nodes=[],edges=[],next=0,selected=0,mode='move',showBody=true,yaw=.2,pitch=0,zoom=1,panX=0,panY=0,drag=null,touches=new Map(),gesture=null,history=[],future=[],dirty=false;
const node=(x,y,z,r)=>({id:next++,x,y,z,r}),get=id=>nodes.find(n=>n.id===id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function snapshot(){return JSON.stringify({nodes,edges,next,selected})}
function checkpoint(){history.push(snapshot());if(history.length>80)history.shift();future=[];buttons();dirty=true}
function restore(s){let d=JSON.parse(s);nodes=d.nodes;edges=d.edges;next=d.next;selected=d.selected;sync()}
function buttons(){$('#undo').disabled=!history.length;$('#redo').disabled=!future.length}
function undo(){if(!history.length)return;future.push(snapshot());restore(history.pop());buttons()}
function redo(){if(!future.length)return;history.push(snapshot());restore(future.pop());buttons()}
function start(){next=0;nodes=[node(0,0,0,.33),node(0,.75,0,.30),node(0,1.25,0,.31),node(-.65,.7,0,.19),node(-1.15,.25,0,.13),node(.65,.7,0,.19),node(1.15,.25,0,.13),node(-.38,-.7,0,.24),node(-.48,-1.4,0,.14),node(.38,-.7,0,.24),node(.48,-1.4,0,.14)];edges=[[0,1],[1,2],[1,3],[3,4],[1,5],[5,6],[0,7],[7,8],[0,9],[9,10]];selected=0;sync()}
const scale=()=>Math.min(innerWidth/3.5,innerHeight/4.5)*zoom;
function project(p){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p.x*cy+p.z*sy,z=-p.x*sy+p.z*cy,y=p.y*cp-z*sp;return{x:innerWidth/2+panX+x*scale(),y:innerHeight*.51+panY-y*scale(),z:p.y*sp+z*cp}}
function inverse(x,y,z){let xx=(x-innerWidth/2-panX)/scale(),yy=-(y-innerHeight*.51-panY)/scale(),cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw),wy=yy*cp+z*sp,wz=-yy*sp+z*cp;return{x:xx*cy-wz*sy,y:wy,z:xx*sy+wz*cy}}
function line(a,b,color,width){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
function draw(){let d=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}g.setTransform(d,0,0,d,0,0);g.fillStyle='#111923';g.fillRect(0,0,innerWidth,innerHeight);
if(showBody){let items=[];for(let n of nodes)items.push({kind:'ball',n,z:project(n).z});for(let [a,b] of edges){let A=get(a),B=get(b);if(A&&B)items.push({kind:'bone',A,B,z:(project(A).z+project(B).z)/2})}items.sort((a,b)=>a.z-b.z);for(let item of items){if(item.kind==='ball'){let p=project(item.n),r=item.n.r*scale(),grad=g.createRadialGradient(p.x-r*.3,p.y-r*.35,1,p.x,p.y,r);grad.addColorStop(0,'#b1c5cf');grad.addColorStop(1,'#435869');g.fillStyle=grad;g.beginPath();g.arc(p.x,p.y,r,0,Math.PI*2);g.fill()}else line(project(item.A),project(item.B),'#6c8292',Math.max(2,(item.A.r+item.B.r)*scale()*.9))}}
for(let [a,b] of edges){let A=get(a),B=get(b);if(A&&B)line(project(A),project(B),'#65d1f6',2)}
for(let n of nodes){let p=project(n);g.beginPath();g.arc(p.x,p.y,n.id===selected?9:6,0,Math.PI*2);g.fillStyle=n.id===selected?'#ffcf89':'#b7eafa';g.fill();g.strokeStyle='#193443';g.lineWidth=2;g.stroke()}requestAnimationFrame(draw)}
function pick(x,y){let best=null,dist=27;for(let n of nodes){let p=project(n),dd=Math.hypot(p.x-x,p.y-y);if(dd<dist){dist=dd;best=n}}return best}
function sync(){let n=get(selected);$('#radius').disabled=!n;if(n){$('#radius').value=n.r;$('#radiusText').textContent=n.r.toFixed(2)}$('#toast').textContent=nodes.length+' joints · '+edges.length+' bones';buttons()}
function add(x,y){let p=get(selected);if(!p)return;checkpoint();let q=inverse(x,y,project(p).z),n=node(q.x,q.y,q.z,p.r*.75);nodes.push(n);edges.push([p.id,n.id]);if($('#mirror').checked&&Math.abs(p.x)<.05&&Math.abs(q.x)>.05){let m=node(-q.x,q.y,q.z,n.r);nodes.push(m);edges.push([p.id,m.id])}selected=n.id;sync()}
function remove(n){if(!n||n.id===0)return;checkpoint();let ids=new Set([n.id]),changed=true;while(changed){changed=false;for(let [a,b] of edges)if(ids.has(a)&&!ids.has(b)){ids.add(b);changed=true}}nodes=nodes.filter(v=>!ids.has(v.id));edges=edges.filter(([a,b])=>!ids.has(a)&&!ids.has(b));selected=0;sync()}
function midpoint(){let a=[...touches.values()];return{x:(a[0][0]+a[1][0])/2,y:(a[0][1]+a[1][1])/2,dist:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===2){drag=null;gesture=midpoint();return}if(touches.size!==1)return;let n=pick(e.clientX,e.clientY);if(mode==='delete'){remove(n);return}if(mode==='add'){if(n){selected=n.id;sync()}else add(e.clientX,e.clientY);return}if(mode==='move'&&n){selected=n.id;drag={id:n.id,z:project(n).z,original:snapshot(),moved:false};sync()}else drag={orbit:true}});
c.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let old=touches.get(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===2){let m=midpoint();if(gesture){zoom=clamp(zoom*m.dist/Math.max(1,gesture.dist),.3,4);panX+=m.x-gesture.x;panY+=m.y-gesture.y}gesture=m;return}if(touches.size!==1)return;if(drag?.orbit||mode==='orbit'){yaw+=(e.clientX-old[0])*.009;pitch=clamp(pitch+(e.clientY-old[1])*.009,-1.35,1.35)}else if(drag?.id!==undefined){let n=get(drag.id),p=inverse(e.clientX,e.clientY,drag.z);if(n){Object.assign(n,p);drag.moved=true}}});
function end(e){if(drag?.id!==undefined&&drag.moved){history.push(drag.original);if(history.length>80)history.shift();future=[];buttons();dirty=true}touches.delete(e.pointerId);drag=null;if(touches.size<2)gesture=null}
c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(v=>v.classList.toggle('active',v===b))});
let radiusStart=null;$('#radius').addEventListener('pointerdown',()=>radiusStart=snapshot());$('#radius').addEventListener('input',e=>{let n=get(selected);if(n){n.r=+e.target.value;$('#radiusText').textContent=n.r.toFixed(2)}});$('#radius').addEventListener('change',()=>{if(radiusStart&&radiusStart!==snapshot()){history.push(radiusStart);future=[];buttons()}radiusStart=null});
$('#undo').onclick=undo;$('#redo').onclick=redo;$('#body').onclick=e=>{showBody=!showBody;e.target.textContent='Body preview: '+(showBody?'on':'off')};$('#front').onclick=()=>{yaw=0;pitch=0;zoom=1;panX=0;panY=0};$('#reset').onclick=()=>{if(confirm('Reset creature?')){checkpoint();start()}};
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
$('#save').onclick=()=>download('pocket-creature.json',JSON.stringify({version:3,nodes,edges},null,2),'application/json');
function sphere(n){let v=[],f=[],lat=10,lon=16;for(let i=0;i<=lat;i++){let t=Math.PI*i/lat;for(let j=0;j<=lon;j++){let a=2*Math.PI*j/lon;v.push([n.x+n.r*Math.sin(t)*Math.cos(a),n.y+n.r*Math.cos(t),n.z+n.r*Math.sin(t)*Math.sin(a)])}}for(let i=0;i<lat;i++)for(let j=0;j<lon;j++){let a=i*(lon+1)+j,b=a+lon+1;f.push([a,b,a+1],[a+1,b,b+1])}return{v,f}}
function tube(A,B){let d=[B.x-A.x,B.y-A.y,B.z-A.z],l=Math.hypot(...d)||1;d=d.map(x=>x/l);let t=Math.abs(d[1])<.9?[0,1,0]:[1,0,0],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],u=cross(d,t),ul=Math.hypot(...u);u=u.map(x=>x/ul);let v=cross(d,u),verts=[],faces=[],s=16;for(let n of [A,B])for(let i=0;i<s;i++){let a=i*2*Math.PI/s;verts.push([n.x+n.r*(u[0]*Math.cos(a)+v[0]*Math.sin(a)),n.y+n.r*(u[1]*Math.cos(a)+v[1]*Math.sin(a)),n.z+n.r*(u[2]*Math.cos(a)+v[2]*Math.sin(a))])}for(let i=0;i<s;i++){let j=(i+1)%s;faces.push([i,j,s+i],[j,s+j,s+i])}return{v:verts,f:faces}}
$('#obj').onclick=()=>{let out=['# Pocket Sculpt 0.3 construction preview','# Overlapping surfaces; NOT a manifold mesh'],offset=0;function add(shape){for(let p of shape.v)out.push('v '+p.join(' '));for(let f of shape.f)out.push('f '+f.map(i=>i+offset+1).join(' '));offset+=shape.v.length}for(let n of nodes)add(sphere(n));for(let [a,b] of edges){let A=get(a),B=get(b);if(A&&B)add(tube(A,B))}download('pocket-creature-preview.obj',out.join('\n'),'text/plain')};
$('#open').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.nodes)||!Array.isArray(d.edges)||!d.nodes.length||d.nodes.some(n=>!Number.isFinite(n.x)||!Number.isFinite(n.y)||!Number.isFinite(n.z)||!Number.isFinite(n.r)||n.r<=0))throw Error('Invalid creature project');checkpoint();nodes=d.nodes;edges=d.edges;next=Math.max(...nodes.map(n=>n.id))+1;selected=nodes[0].id;sync()}catch(err){alert('Open failed: '+err.message)}e.target.value=''};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});start();draw();
</script></body></html>
