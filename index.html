<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pocket Sculpt | Creature Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111923;color:#eaf2f8;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
header,footer,aside{position:fixed;z-index:2}header{top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;background:#111923df}footer{bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:12px;background:#111923ef}aside{right:10px;top:70px;width:145px;background:#223243ee;border-radius:14px;padding:12px;display:grid;gap:8px}button{background:#2b4052;border:1px solid #526779;color:white;border-radius:10px;padding:10px}button.active{background:#89c8e9;color:#14212b}input{width:100%}small{color:#9fb7c8}
</style></head><body>
<canvas id="canvas"></canvas><header><div><b>POCKET SCULPT</b><br><small>Creature Builder v0.2</small></div><div><button id="save">Save</button><button id="export">OBJ</button></div></header>
<aside><small>Joint thickness</small><input id="radius" type="range" min=".05" max=".65" step=".01" value=".25"><label><input id="mirror" type="checkbox" checked style="width:auto"> Mirror additions</label><button id="body">Body: on</button><button id="front">Front view</button><button id="open">Open project</button><input id="file" type="file" accept=".json" hidden></aside>
<footer><button data-mode="move" class="active">Move</button><button data-mode="add">Add limb</button><button data-mode="delete">Delete</button><button data-mode="orbit">Orbit</button></footer>
<script>
const c=document.querySelector('#canvas'),g=c.getContext('2d');let nodes=[],edges=[],next=0,selected=0,mode='move',showBody=true,yaw=.2,pitch=0,zoom=1,drag=null,touches=new Map(),pinch=0;
function node(x,y,z,r){return {id:next++,x,y,z,r}}
function start(){next=0;nodes=[node(0,0,0,.33),node(0,.75,0,.3),node(0,1.25,0,.3),node(-.65,.7,0,.19),node(-1.15,.25,0,.13),node(.65,.7,0,.19),node(1.15,.25,0,.13),node(-.38,-.7,0,.24),node(-.48,-1.4,0,.14),node(.38,-.7,0,.24),node(.48,-1.4,0,.14)];edges=[[0,1],[1,2],[1,3],[3,4],[1,5],[5,6],[0,7],[7,8],[0,9],[9,10]];selected=0;sync()}
const get=id=>nodes.find(n=>n.id===id),scale=()=>Math.min(innerWidth/3.5,innerHeight/4.5)*zoom;
function project(p){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p.x*cy+p.z*sy,z=-p.x*sy+p.z*cy,y=p.y*cp-z*sp;return {x:innerWidth/2+x*scale(),y:innerHeight*.51-y*scale(),z:p.y*sp+z*cp}}
function inverse(x,y,z){let xx=(x-innerWidth/2)/scale(),yy=-(y-innerHeight*.51)/scale(),cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw),wy=yy*cp+z*sp,wz=-yy*sp+z*cp;return {x:xx*cy-wz*sy,y:wy,z:xx*sy+wz*cy}}
function line(a,b,color,width){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
function draw(){let d=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(innerWidth*d)||c.height!==Math.round(innerHeight*d)){c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d)}g.setTransform(d,0,0,d,0,0);g.fillStyle='#111923';g.fillRect(0,0,innerWidth,innerHeight);
if(showBody){let items=[];for(let n of nodes)items.push({type:'ball',n,z:project(n).z});for(let [a,b] of edges){let A=get(a),B=get(b);if(A&&B)items.push({type:'bone',A,B,z:(project(A).z+project(B).z)/2})}items.sort((a,b)=>a.z-b.z);for(let item of items){if(item.type==='ball'){let p=project(item.n),r=item.n.r*scale();let grad=g.createRadialGradient(p.x-r*.3,p.y-r*.35,2,p.x,p.y,r);grad.addColorStop(0,'#a8bac5');grad.addColorStop(1,'#435767');g.fillStyle=grad;g.beginPath();g.arc(p.x,p.y,r,0,Math.PI*2);g.fill()}else{let A=project(item.A),B=project(item.B);line(A,B,'#6d8291',((item.A.r+item.B.r)/2)*scale()*1.75)}}}
for(let [a,b] of edges){let A=get(a),B=get(b);if(A&&B)line(project(A),project(B),'#65d1f6',2)}
for(let n of nodes){let p=project(n);g.beginPath();g.arc(p.x,p.y,n.id===selected?8:5,0,Math.PI*2);g.fillStyle=n.id===selected?'#ffcf89':'#b7eafa';g.fill()}requestAnimationFrame(draw)}
function pick(x,y){let best=null,dist=25;for(let n of nodes){let p=project(n),dd=Math.hypot(p.x-x,p.y-y);if(dd<dist){dist=dd;best=n}}return best}
function sync(){document.querySelector('#radius').value=get(selected)?.r||.2}
function add(x,y){let p=get(selected),q=inverse(x,y,project(p).z),n=node(q.x,q.y,q.z,p.r*.75);nodes.push(n);edges.push([p.id,n.id]);if(document.querySelector('#mirror').checked&&Math.abs(p.x)<.05&&Math.abs(q.x)>.05){let m=node(-q.x,q.y,q.z,n.r);nodes.push(m);edges.push([p.id,m.id])}selected=n.id;sync()}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size>1){drag=null;return}let n=pick(e.clientX,e.clientY);if(mode==='delete'&&n&&n.id!==0){let ids=new Set([n.id]);let changed=true;while(changed){changed=false;for(let [a,b] of edges)if(ids.has(a)&&!ids.has(b)){ids.add(b);changed=true}}nodes=nodes.filter(v=>!ids.has(v.id));edges=edges.filter(([a,b])=>!ids.has(a)&&!ids.has(b));selected=0;sync();return}if(mode==='add'){if(n){selected=n.id;sync()}else add(e.clientX,e.clientY);return}if(mode==='move'&&n){selected=n.id;drag={id:n.id,z:project(n).z};sync()}else drag={orbit:true}});
c.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let old=touches.get(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size>1){let a=[...touches.values()],dist=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch)zoom=Math.max(.35,Math.min(3,zoom*dist/pinch));pinch=dist;return}if(drag?.orbit||mode==='orbit'){yaw+=(e.clientX-old[0])*.009;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-old[1])*.009))}else if(drag?.id!==undefined){let n=get(drag.id),p=inverse(e.clientX,e.clientY,drag.z);Object.assign(n,p)}});
function end(e){touches.delete(e.pointerId);drag=null;pinch=0}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(v=>v.classList.toggle('active',v===b))});
document.querySelector('#radius').oninput=e=>{get(selected).r=+e.target.value};
document.querySelector('#body').onclick=e=>{showBody=!showBody;e.target.textContent='Body: '+(showBody?'on':'off')};
document.querySelector('#front').onclick=()=>{yaw=0;pitch=0;zoom=1};
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.querySelector('#save').onclick=()=>download('creature.json',JSON.stringify({nodes,edges},null,2),'application/json');
document.querySelector('#export').onclick=()=>{let lines=['# Pocket Sculpt preview: overlapping parts, not watertight'],v=0;for(let n of nodes){let r=n.r;for(let p of [[-r,0,0],[r,0,0],[0,-r,0],[0,r,0],[0,0,-r],[0,0,r]])lines.push('v '+[n.x+p[0],n.y+p[1],n.z+p[2]].join(' '));for(let f of [[1,4,5],[4,2,5],[2,3,5],[3,1,5],[4,1,6],[2,4,6],[3,2,6],[1,3,6]])lines.push('f '+f.map(i=>i+v).join(' '));v+=6}download('creature-preview.obj',lines.join('\n'),'text/plain')};
document.querySelector('#open').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw Error('Invalid project');nodes=d.nodes;edges=d.edges;next=Math.max(...nodes.map(n=>n.id))+1;selected=nodes[0].id;sync()}catch(err){alert(err.message)}};
start();draw();
</script></body></html>
